# For a guide to configuration, visit https://qlty.sh/d/config
# Or for a full reference, visit https://qlty.sh/d/qlty-toml
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  "**/.claude/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "block"

[[source]]
name = "default"
default = true

# Security linters that no job in lint.yml runs. SwiftLint, actionlint, shellcheck,
# yamllint and markdownlint already run there.

# GitHub Actions workflows
[[plugin]]
name = "zizmor"

[[plugin]]
name = "checkov"

# Vulnerable dependencies (Package.resolved)
[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "trivy"

# Committed secrets
[[plugin]]
name = "gitleaks"

[[plugin]]
name = "trufflehog"

# TODO/NOTE/FIXME comments, so every open one is tracked in an issue and triaged below
[[plugin]]
name = "ripgrep"

# The tag and ref inputs of the manual dispatch are the documented way to re-run a
# failed publish of a draft release (see "Release process" in CLAUDE.md).
[[triage]]
match.rules = ["checkov:CKV_GHA_7"]
match.file_patterns = [".github/workflows/publish.yml"]
set.ignored = true

# Known TODO, tracked in https://github.com/udondan/reminders-cli/issues/124
# (CustomSortOrder until macOS 12 is the minimum). Remove this entry with the TODO.
[[triage]]
match.rules = ["ripgrep:TODO"]
match.file_patterns = ["Sources/RemindersLibrary/Sort.swift"]
set.ignored = true

# The NOTE in testTonight explains why the test only asserts "evening, on the hour"; it's not an
# open task.
[[triage]]
match.rules = ["ripgrep:NOTE"]
match.file_patterns = ["Tests/RemindersTests/NaturalLanguageTests.swift"]
set.ignored = true
