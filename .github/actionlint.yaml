# actionlint doesn't know the self-repository syntax `uses: $/...` yet, which
# runs a workflow of this repository at the running commit.
paths:
  .github/workflows/mr-test.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/lint\.yml"'
  .github/workflows/release-please.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/publish\.yml"'
