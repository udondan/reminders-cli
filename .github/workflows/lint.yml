---
name: Lint

on:
  # Called by mr-test.yml, so its required job covers the linters too.
  workflow_call:

permissions:
  contents: read

# Each linter is its own job so a failure names the file type. The linters' versions are in mise.toml, where
# Renovate updates them, and each job installs only the ones it runs.
jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Files and rules come from .markdownlint-cli2.yaml, whose globs add to the action's default of the root files.
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: lychee

      - name: lychee
        env:
          # Authenticated requests to GitHub links are not rate limited as quickly.
          GITHUB_TOKEN: ${{ github.token }}
        run: lychee --config lychee.toml --no-progress README.md CLAUDE.md 'skills/**/*.md'

  swift:
    # The Linux build of SwiftLint links against libxml2.so.2, which Ubuntu
    # 26.04 (now ubuntu-latest) no longer ships.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  makefile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: checkmake

      - name: checkmake
        run: checkmake Makefile

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: pypi:yamllint

      # Files and rules come from .yamllint.yml.
      - name: yamllint
        run: yamllint --strict --format github .

  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: actionlint shellcheck

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: shellcheck

      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Syntax only: release-please and SwiftPM own the formatting of the files they write.
      - name: jq
        run: git ls-files -z '*.json' '*.resolved' | xargs -0 -n1 jq empty

  # The security plugins of .qlty/qlty.toml, and code smells (complexity, duplication). Git-aware: only smells
  # introduced by the PR compared to main fail the job.
  qlty:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install qlty
        uses: qltysh/qlty-action/install@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0

      - name: Lint via qlty plugins
        run: qlty check --all

      - name: Report code smells
        if: github.event_name != 'pull_request'
        run: qlty smells --all --no-snippets

      - name: Report new code smells
        if: github.event_name == 'pull_request'
        run: qlty smells --upstream origin/main --no-snippets

      - name: Fail on new code smells
        if: github.event_name == 'pull_request'
        run: |
          count=$(qlty smells --upstream origin/main --json --quiet 2>/dev/null | jq length)
          if [ "$count" -gt 0 ]; then
            echo "::error::qlty found $count new code smell(s) compared to main"
            exit 1
          fi
