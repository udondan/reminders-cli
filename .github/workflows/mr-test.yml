---
name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Each job asks for the permissions it needs.
permissions: {}

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            code:
              - Sources/**
              - Tests/**
              - .github/scripts/live-test/**
              - .github/workflows/mr-test.yml
              - Makefile
              - Package.swift
              - Package.resolved

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: swift test -Xswiftc -warnings-as-errors --enable-code-coverage

      - name: Export coverage
        if: steps.changes.outputs.code == 'true'
        run: |
          codecov_dir=$(dirname "$(swift test --show-codecov-path)")
          bin_path=$(swift build --show-bin-path)
          bundle=$(find "$bin_path" -maxdepth 1 -name '*.xctest' | head -n 1)
          xcrun llvm-cov export -format=lcov \
            -instr-profile "$codecov_dir/default.profdata" \
            -ignore-filename-regex '\.build/|Tests/' \
            "$bundle/Contents/MacOS/$(basename "$bundle" .xctest)" \
            | sed "s|^SF:$GITHUB_WORKSPACE/|SF:|" > lcov-unit.info

      - name: Keep coverage for the upload job
        if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: lcov-unit.info
          if-no-files-found: error

      - name: Package
        if: steps.changes.outputs.code == 'true'
        run: make package

  # The unit tests can't reach the EventKit store I/O; the live test runs it. Both coverage reports
  # go to Codecov in one upload, so Codecov computes its status once, from the merged data.
  upload-coverage:
    runs-on: ubuntu-latest
    needs: [build, live-test]
    if: always() && needs.build.result == 'success' && needs.build.outputs.code == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: List coverage reports
        id: files
        run: |
          files=$(find . -maxdepth 1 -name 'lcov-*.info' | sort | paste -sd, -)
          echo "Coverage reports: $files"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          disable_search: true
          files: ${{ steps.files.outputs.files }}

  # Codecov reports its result as the check runs codecov/project and
  # codecov/patch. This job waits for them, so a coverage drop fails the
  # required job. It is skipped along with the tests, e.g. when only the README
  # changes, and passes with a warning if Codecov doesn't report in time.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [build, upload-coverage]
    if: always() && github.event_name == 'pull_request' && needs.upload-coverage.result == 'success'
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  live-test:
    # Exercises the real EventKit store end to end against a throwaway list, covering the store
    # I/O the unit tests can't reach (fetch, save, commit, create and delete lists). It only works
    # because hosted runners disable SIP, which lets us grant Reminders access without the prompt.
    # The binary is built with coverage instrumentation, and its coverage is uploaded together
    # with the unit tests' by upload-coverage.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    permissions:
      contents: read
      pull-requests: read
    env:
      # The test asserts exact UTC due dates from timezone-free date strings, so pin the runner's
      # timezone rather than depend on it defaulting to UTC.
      TZ: UTC
      # %p: one profile per process, merged after the test.
      LLVM_PROFILE_FILE: ${{ github.workspace }}/.build/live-coverage/%p.profraw
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            code:
              - Sources/**
              - Tests/**
              - .github/scripts/live-test/**
              - .github/workflows/mr-test.yml
              - Makefile
              - Package.swift
              - Package.resolved

      - name: Build
        if: steps.changes.outputs.code == 'true'
        # The flags --enable-code-coverage adds to `swift test`.
        run: swift build -Xswiftc -profile-generate -Xswiftc -profile-coverage-mapping

      - name: Grant Reminders access
        if: steps.changes.outputs.code == 'true'
        run: bash .github/scripts/live-test/grant-reminders-access.sh .build/debug/reminders

      # The live test completes a list name in each shell; the system bash (3.2) is too old for
      # the generated completion script.
      - name: Install bash and fish
        if: steps.changes.outputs.code == 'true'
        run: |
          for shell in bash fish; do
            [ -x "$(brew --prefix)/bin/$shell" ] || brew install "$shell"
          done

      - name: Live test
        if: steps.changes.outputs.code == 'true'
        timeout-minutes: 5
        run: |
          set +e
          bash .github/scripts/live-test/live-test.sh .build/debug/reminders
          code=$?
          if [ "$code" = 20 ]; then
            echo "::warning::Skipped: this runner has no reminder source to hold a new list."
            exit 0
          fi
          exit $code

      # Also after a failed test, so the coverage of what did run still counts.
      - name: Export coverage
        if: always() && steps.changes.outputs.code == 'true'
        run: |
          xcrun llvm-profdata merge -sparse .build/live-coverage/*.profraw -o live.profdata
          xcrun llvm-cov export -format=lcov \
            -instr-profile live.profdata \
            -ignore-filename-regex '\.build/|Tests/' \
            .build/debug/reminders \
            | sed "s|^SF:$GITHUB_WORKSPACE/|SF:|" > "lcov-live-${{ matrix.os }}.info"

      - name: Keep coverage for the upload job
        if: always() && steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-live-${{ matrix.os }}
          path: lcov-live-${{ matrix.os }}.info
          if-no-files-found: error

  skill-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check SKILL.md JSON field table against EncodingKeys
        run: bash .github/scripts/check-skill-json-fields.sh

  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs: [build, upload-coverage, coverage, live-test, skill-docs, lint]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
