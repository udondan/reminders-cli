---
name: MR Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            code:
              - Sources/**
              - Tests/**
              - .github/workflows/mr-test.yml
              - Makefile
              - Package.swift
              - Package.resolved

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: swift test -Xswiftc -warnings-as-errors --enable-code-coverage

      - name: Export coverage
        if: steps.changes.outputs.code == 'true'
        run: |
          codecov_dir=$(dirname "$(swift test --show-codecov-path)")
          bin_path=$(swift build --show-bin-path)
          bundle=$(find "$bin_path" -maxdepth 1 -name '*.xctest' | head -n 1)
          xcrun llvm-cov export -format=lcov \
            -instr-profile "$codecov_dir/default.profdata" \
            -ignore-filename-regex '\.build/|Tests/' \
            "$bundle/Contents/MacOS/$(basename "$bundle" .xctest)" > lcov.info

      - name: Upload coverage to Codecov
        if: steps.changes.outputs.code == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: lcov.info

      - name: Package
        if: steps.changes.outputs.code == 'true'
        run: make package

  # Codecov reports its result as the check runs codecov/project and
  # codecov/patch. This job waits for them, so a coverage drop fails the
  # required job. It is skipped along with the tests, e.g. when only the README
  # changes, and passes with a warning if Codecov doesn't report in time.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' && needs.build.result == 'success' && needs.build.outputs.code == 'true'
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  live-test:
    # Exercises the real EventKit store end to end against a throwaway list, covering the store
    # I/O the unit tests can't reach (fetch, save, commit, create and delete lists). It only works
    # because hosted runners disable SIP, which lets us grant Reminders access without the prompt.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    permissions:
      contents: read
      pull-requests: read
    env:
      # The test asserts exact UTC due dates from timezone-free date strings, so pin the runner's
      # timezone rather than depend on it defaulting to UTC.
      TZ: UTC
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            code:
              - Sources/**
              - .github/scripts/live-test/**
              - .github/workflows/mr-test.yml
              - Package.swift
              - Package.resolved

      - name: xcode-select
        if: steps.changes.outputs.code == 'true' && matrix.os == 'macos-14'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: swift build

      - name: Grant Reminders access
        if: steps.changes.outputs.code == 'true'
        run: bash .github/scripts/live-test/grant-reminders-access.sh .build/debug/reminders

      - name: Live test
        if: steps.changes.outputs.code == 'true'
        timeout-minutes: 5
        run: |
          set +e
          bash .github/scripts/live-test/live-test.sh .build/debug/reminders
          code=$?
          if [ "$code" = 20 ]; then
            echo "::warning::Skipped: this runner has no reminder source to hold a new list."
            exit 0
          fi
          exit $code

  skill-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check SKILL.md JSON field table against EncodingKeys
        run: bash .github/scripts/check-skill-json-fields.sh

  lint:
    uses: ./.github/workflows/lint.yml

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs: [build, coverage, live-test, skill-docs, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
